<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connect with me – Hossen Khan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:            #07060f;
  --card-bg:       #0e0c1b;
  --card-border:   rgba(160, 60, 180, 0.18);
  --card-border-h: rgba(218, 80, 200, 0.72);
  --icon-bg:       rgba(130, 40, 160, 0.22);
  --icon-bg-h:     rgba(185, 55, 185, 0.48);
  --text:          #f0ebff;
  --muted:         rgba(240,235,255,0.38);
  --radius:        15px;
}

html { scroll-behavior: smooth; }

body {
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: 'Outfit', sans-serif;
  font-weight: 600;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 52px 18px 64px;
  overflow-x: hidden;
}

/* Top ambient glow – purple + pink */
body::before {
  content: '';
  position: fixed;
  top: -260px; left: 50%;
  transform: translateX(-50%);
  width: 750px; height: 560px;
  border-radius: 50%;
  background: radial-gradient(ellipse at 40% 50%,
    rgba(140,60,240,0.22) 0%,
    rgba(220,70,168,0.14) 45%,
    transparent 70%);
  pointer-events: none; z-index: 0;
}

/* Bottom-right pink accent */
body::after {
  content: '';
  position: fixed;
  bottom: -180px; right: -120px;
  width: 420px; height: 420px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(220,70,168,0.13) 0%, transparent 68%);
  pointer-events: none; z-index: 0;
}

.page {
  position: relative; z-index: 1;
  width: 100%;
  max-width: 560px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* Avatar */
.avatar-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-bottom: 32px;
  animation: fadeDown 0.7s cubic-bezier(.22,1,.36,1) both;
}

/* Ring: lowered opacity on the band itself, full-strength glow kept */
.avatar-ring {
  width: 112px; height: 112px;
  border-radius: 50%;
  padding: 3px;
  background: conic-gradient(
    rgba(90,20,160,0.40),
    rgba(200,55,220,0.58),
    rgba(220,70,170,0.62),
    rgba(160,50,230,0.50),
    rgba(90,20,160,0.40)
  );
  margin-bottom: 22px;
  animation: ringPulse 3s ease-in-out infinite;
}
@keyframes ringPulse {
  0%,100% { box-shadow: 0 0 18px 4px rgba(190,60,230,0.65), 0 0 40px 8px rgba(220,70,168,0.30); }
  50%      { box-shadow: 0 0 32px 9px rgba(210,70,245,0.85), 0 0 64px 18px rgba(220,70,168,0.46); }
}

.avatar-inner {
  width: 100%; height: 100%;
  border-radius: 50%;
  overflow: hidden;
  background: #130f20;
  display: flex; align-items: center; justify-content: center;
}
.avatar-inner img { width: 100%; height: 100%; object-fit: cover; display: block; }

.avatar-fallback {
  font-size: 2.2rem; font-weight: 800;
  background: linear-gradient(135deg, #b060ff, #e060c0);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  display: none;
}

.page-title {
  font-size: clamp(1.1rem, 3.8vw, 1.3rem);
  font-weight: 700;
  letter-spacing: 0.01em;
  color: var(--text);
  text-align: center;
}

/* Links */
.links {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 11px;
  margin-bottom: 38px;
}

/* Buttons start hidden; JS adds .arrived to trigger the slide-in */
.link-btn {
  display: flex;
  align-items: center;
  gap: 16px;
  width: 100%;
  padding: 15px 20px;
  border-radius: var(--radius);
  border: 1px solid var(--card-border);
  background: var(--card-bg);
  color: var(--text);
  text-decoration: none;
  font-family: 'Outfit', sans-serif;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  opacity: 0;
  transform: translateX(60px);
  transition: border-color .28s, box-shadow .28s, background .28s;
}

.link-btn.arrived {
  animation: arriveFromRight 0.55s cubic-bezier(.22,1,.36,1) forwards;
}
@keyframes arriveFromRight {
  0%   { opacity: 0; transform: translateX(60px); }
  60%  { opacity: 1; transform: translateX(-6px);  }
  80%  { transform: translateX(3px); }
  100% { opacity: 1; transform: translateX(0);     }
}

.link-btn.settled { opacity: 1; transform: translateX(0); }

.link-btn.settled:hover {
  border-color: var(--card-border-h);
  background: #14102a;
  transform: translateY(-2px);
  box-shadow:
    0 0 0 1px rgba(215,80,200,.22),
    0 0 20px rgba(185,55,205,.40),
    0 0 46px rgba(220,70,168,.18),
    inset 0 1px 0 rgba(225,130,255,.08);
}
.link-btn.settled:hover::after { opacity: 1; }
.link-btn.settled:active { transform: scale(0.976); }

/* Shimmer sweep */
.link-btn::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(108deg, transparent 35%, rgba(225,110,255,.05) 55%, transparent 75%);
  opacity: 0; transition: opacity .28s;
  pointer-events: none;
}

/* Icon box */
.icon-box {
  width: 42px; height: 42px;
  border-radius: 10px;
  background: var(--icon-bg);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: background .28s, box-shadow .28s;
  will-change: transform;
}
.link-btn.settled:hover .icon-box {
  background: var(--icon-bg-h);
  box-shadow: 0 0 16px rgba(215,70,200,.55);
}

/* Click: icon slides right → snaps back */
.link-btn.clicked .icon-box {
  animation: iconSlide .60s cubic-bezier(.34,1.56,.64,1) forwards;
}
@keyframes iconSlide {
  0%   { transform: translateX(0);    }
  35%  { transform: translateX(24px); }
  65%  { transform: translateX(24px); }
  100% { transform: translateX(0);    }
}

/* Fill-based icons */
.icon-svg {
  width: 21px; height: 21px;
  fill: currentColor;
  color: #c08aff;
  transition: color .2s;
  flex-shrink: 0;
}
/* Stroke-based icon (Mail) */
.icon-svg-stroke {
  width: 21px; height: 21px;
  fill: none;
  stroke: #c08aff;
  stroke-width: 1.9;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
  transition: stroke .2s;
}
.link-btn.settled:hover .icon-svg       { color:  #e8bbff; }
.link-btn.settled:hover .icon-svg-stroke { stroke: #e8bbff; }

.link-label { flex: 1; }

/* Gradient copyright */
.footer {
  font-size: 0.80rem;
  font-weight: 700;
  text-align: center;
  letter-spacing: 0.02em;
  background: linear-gradient(90deg, #9b5af5 0%, #d946a8 55%, #ff88cc 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

@keyframes fadeDown {
  from { opacity:0; transform:translateY(-16px); }
  to   { opacity:1; transform:translateY(0); }
}

@media (min-width: 600px) {
  .link-btn  { padding: 17px 24px; gap: 18px; }
  .icon-box  { width: 46px; height: 46px; border-radius: 12px; }
  .icon-svg, .icon-svg-stroke { width: 23px; height: 23px; }
  .link-label{ font-size: 1.04rem; }
  .avatar-ring { width: 120px; height: 120px; }
}
@media (min-width: 900px) {
  body { padding: 72px 20px 80px; }
  .page { max-width: 600px; }
  .link-btn { padding: 18px 28px; }
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function () {
  var btns = document.querySelectorAll('.link-btn');
  btns.forEach(function (btn, i) {
    setTimeout(function () {
      btn.classList.add('arrived');
      btn.addEventListener('animationend', function once(e) {
        if (e.animationName === 'arriveFromRight') {
          btn.classList.remove('arrived');
          btn.classList.add('settled');
          btn.removeEventListener('animationend', once);
        }
      });
    }, 100 + i * 75);
  });
});

function handleClick(e, btn) {
  if (!btn.classList.contains('clicked')) {
    btn.classList.add('clicked');
    var box = btn.querySelector('.icon-box');
    box.addEventListener('animationend', function once() {
      btn.classList.remove('clicked');
      box.removeEventListener('animationend', once);
    });
  }
}
</script>
